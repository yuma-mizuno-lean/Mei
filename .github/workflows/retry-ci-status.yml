name: Retry CI status publication

# Replay retained terminal statuses only; never rerun the source build.
on:
  workflow_run:
    workflows: [pr-build]
    types: [completed]

permissions:
  contents: read
  actions: read
  pull-requests: read
  statuses: write

jobs:
  publish:
    uses: yuma-mizuno-lean/TauCetiTools/.github/workflows/retry-ci-status.yml@35d3b9a330a55632ff27718f4c2a1f7292739f1c
    with:
      tools_repository: yuma-mizuno-lean/TauCetiTools
      tools_ref: 35d3b9a330a55632ff27718f4c2a1f7292739f1c
      project_ref: ${{ github.workflow_sha }}
    secrets:
      CI_READ_APP_ID: ${{ secrets.CI_READ_APP_ID }}
      CI_READ_APP_PRIVATE_KEY: ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
      CI_STATUS_APP_ID: ${{ secrets.CI_STATUS_APP_ID }}
      CI_STATUS_APP_PRIVATE_KEY: ${{ secrets.CI_STATUS_APP_PRIVATE_KEY }}
