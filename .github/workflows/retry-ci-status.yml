name: Retry CI status publication

# Replay retained statuses, and recover abandoned PR builds on the existing workflow.
on:
  workflow_run:
    workflows: [pr-build]
    types: [completed]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch: {}

permissions:
  contents: read
  actions: write
  pull-requests: read
  statuses: write

jobs:
  publish:
    uses: yuma-mizuno-lean/TauCetiTools/.github/workflows/retry-ci-status.yml@f42a425ab56d2a23e4f69f83c1ebe9a6d18de085
    with:
      tools_repository: yuma-mizuno-lean/TauCetiTools
      tools_ref: f42a425ab56d2a23e4f69f83c1ebe9a6d18de085
      project_ref: ${{ github.workflow_sha }}
    secrets:
      CI_READ_APP_ID: ${{ secrets.CI_READ_APP_ID }}
      CI_READ_APP_PRIVATE_KEY: ${{ secrets.CI_READ_APP_PRIVATE_KEY }}
      CI_STATUS_APP_ID: ${{ secrets.CI_STATUS_APP_ID }}
      CI_STATUS_APP_PRIVATE_KEY: ${{ secrets.CI_STATUS_APP_PRIVATE_KEY }}
