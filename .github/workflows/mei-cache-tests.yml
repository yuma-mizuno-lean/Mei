name: Mei cache transport tests
on:
  pull_request:
    paths:
      - scripts/mei_release_cache.py
      - scripts/mei_worker_lake.py
      - scripts/test_mei_release_cache.py
      - .github/workflows/mei-cache-tests.yml
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Transport validation tests
        run: python3 scripts/test_mei_release_cache.py
      - name: Prepare pinned shared tools
        uses: yuma-mizuno-lean/TauCetiTools/.github/actions/setup@5aa5d085a0b779a3ff6068b60655500946c0c70a
        with:
          tools-repository: yuma-mizuno-lean/TauCetiTools
          tools-ref: 5aa5d085a0b779a3ff6068b60655500946c0c70a
          project-directory: .
      - name: Install pinned elan
        run: |
          curl --fail --location --retry 2 --max-time 120 https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz -o elan.tar.gz
          echo 'df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2  elan.tar.gz' | sha256sum -c -
          tar -xzf elan.tar.gz elan-init
          ./elan-init -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: ./.github/actions/restore-lean-toolchain
        with:
          project-dir: .
          tooling-dir: .
      - name: Real Lake restore, invalidation and cold-build equivalence
        run: MEI_CACHE_INTEGRATION=1 ELAN_TOOLCHAIN="$(cat lean-toolchain)" python3 scripts/test_mei_release_cache.py
